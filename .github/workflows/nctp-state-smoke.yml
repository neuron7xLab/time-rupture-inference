name: nctp-state-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nctp-state-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-ci.lock
      - name: lint adaptive state slice
        run: ruff check src/ctios/nctp_state tools/nctp_state_smoke.py
      - name: type adaptive state slice
        run: mypy --strict src/ctios/nctp_state
      - name: run adaptive state smoke
        run: PYTHONPATH=src python tools/nctp_state_smoke.py
